name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # استخدام الأداة الرسمية لتشغيل الـ Gradle وتفادي أي تعارض في الإصدارات
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.2

    # منح صلاحية التنفيذ احتياطاً
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # تشغيل البناء مباشرة
    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: DarkNet-ROMA-APK
        path: app/build/outputs/apk/debug/app-debug.apk
